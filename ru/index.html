<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <base href=".." />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style-print.css" />
    <link rel="stylesheet" href="style-mobile.css" />

    <script src="persist.js"></script>
    <script src="persist-schema.js"></script>

    <script>
        window.addEventListener("load", async () => {
            await setUpPersistenceWithDndSchema({ form: document.querySelector("form#main") });
        }, { once: true });
    </script>
</head>

<body>
    <form id="main" autocomplete="off">
        <div class="column">
            <div class="box">
                <label class="under">Имя <input name="name" /></label>
                <label class="under">Происхождение <input name="background" /></label>
                <label class="under">Вид <input name="species" /></label>
                <label class="under">Класс <input name="class" /></label>
                <label class="under">Подкласс <input name="subclass" /></label>
            </div>
            <div class="box">
                <label class="beside"><input name="proficiency_bonus" /> Бонус мастерства</label>
            </div>
            <div class="box">
                <label class="beside"><input name="acrobatics" /> Акробатика <small>(Dex)</small></label>
                <label class="beside"><input name="athletics" /> Атлетика <small>(Str)</small></label>
                <label class="beside"><input name="perception" /> Внимательность <small>(Wis)</small></label>
                <label class="beside"><input name="survival" /> Выживание <small>(Wis)</small></label>
                <label class="beside"><input name="performance" /> Выступление <small>(Cha)</small></label>
                <label class="beside"><input name="intimidation" /> Запугивание <small>(Cha)</small></label>
                <label class="beside"><input name="history" /> История <small>(Int)</small></label>
                <label class="beside"><input name="sleight_of_hand" /> Ловкость рук <small>(Dex)</small></label>
                <label class="beside"><input name="arcana" /> Магия <small>(Int)</small></label>
                <label class="beside"><input name="medicine" /> Медицина <small>(Wis)</small></label>
                <label class="beside"><input name="deception" /> Обман <small>(Cha)</small></label>
                <label class="beside"><input name="nature" /> Природа <small>(Int)</small></label>
                <label class="beside"><input name="insight" /> Проницательность <small>(Wis)</small></label>
                <label class="beside"><input name="investigation" /> Расследование <small>(Int)</small></label>
                <label class="beside"><input name="religion" /> Религия <small>(Int)</small></label>
                <label class="beside"><input name="stealth" /> Скрытность <small>(Dex)</small></label>
                <label class="beside"><input name="persuasion" /> Убеждение <small>(Cha)</small></label>
                <label class="beside"><input name="animal_handling" /> Уход за животными <small>(Wis)</small></label>
            </div>
            <div class="box" style="flex: 1">
                <label class="textarea">Владения <textarea name="proficiencies"></textarea></label>
            </div>
        </div>

        <div class="column">
            <div class="box">
                <div class="colspan">
                    <label class="under" style="flex: 1">Уровень <input name="level" size="1" /></label>
                    <label class="under" style="flex: 2">Опыт <input name="xp" size="1" /></label>
                </div>
            </div>
            <div class="box">
                <label class="under">Сила (Str) <input name="str" /></label>
                <label class="under">Ловкость (Dex) <input name="dex" /></label>
                <label class="under">Телосложение (Con) <input name="con" /></label>
                <label class="under">Интеллект (Int) <input name="int" /></label>
                <label class="under">Мудрость (Wis) <input name="wis" /></label>
                <label class="under">Харизма (Cha) <input name="cha" /></label>
            </div>
            <div class="box" style="flex: 1">
                <label class="textarea">Черты и умения <textarea name="feats"></textarea></label>
            </div>
        </div>

        <div class="column">
            <div class="box">
                <label class="under">Текущие хиты <input name="hp" /></label>
                <div class="colspan">
                    <label class="under" style="flex: 2">Временные <input name="temp_hp" size="1" /></label>
                    <label class="under" style="flex: 1">Максимум <input name="max_hp" size="1" /></label>
                </div>
            </div>
            <div class="box">
                <label class="under">Кости хитов <input name="hit_dice" /></label>
                <label class="under">Спасброски от смерти <input name="death_saves" /></label>
            </div>
            <div class="box">
                <div class="colspan">
                    <label class="under" style="flex: 1">Класс брони <input name="ac" size="1" /></label>
                    <label class="under" style="flex: 1">Инициатива <input name="initiative" size="1" /></label>
                    <label class="under" style="flex: 1">Скорость <input name="speed" size="1" /></label>
                </div>
                <div class="colspan">
                    <label class="under" style="flex: 1">Размер <input name="size" size="1" /></label>
                    <label class="under" style="flex: 1">Пассивная внимательность <input name="passive_perception"
                            size="1" /></label>
                </div>
            </div>
            <div class="box" style="flex: 1">
                <label class="textarea">Оружие и атаки <textarea name="attacks"></textarea></label>
            </div>
            <div class="box">
                <label class="under">Монеты <input name="money" /></label>
            </div>
            <div class="box" style="flex: 3">
                <label class="textarea">Снаряжение <textarea name="equipment"></textarea></label>
            </div>
        </div>
    </form>
</body>

</html>
