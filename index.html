<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        :root {
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
            background: #999;
        }

        body {
            background: white;
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
        }

        label {
            font-variant: small-caps;
        }

        input:not([type]),
        input[type=text] {
            border: none;
            border-bottom: solid 1pt #999;
            font-size: 14pt;
        }

        small {
            color: #999;
        }

        .box {
            margin: 5px;
            padding: 5px;
            border: solid 1px black;
            border-radius: 3px;
        }

        .box-lines {
            display: flex;
            flex-flow: column nowrap;
        }

        .box-lines>* {
            display: flex;
            flex-flow: column-reverse nowrap;
            font-size: 10pt;
            width: 98%;
            margin: 0 auto;
        }

        .box-skills {
            display: flex;
            flex-flow: column nowrap;
            font-size: 12pt;
        }

        .box-skills input {
            width: 50px;
        }

        .box-textarea {
            display: flex;
            flex-flow: column nowrap;
        }

        .box-textarea>* {
            display: flex;
            flex-flow: column nowrap;
            width: 98%;
        }

        .box-textarea textarea {
            resize: vertical;
            width: 100%;
            border: none;
            background: repeat url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200pt' height='15pt' viewBox='0 0 200 15'><line x1='0' y1='14' x2='200' y2='14' stroke='%23999' stroke-width='1' /></svg>");
            line-height: 15pt;
        }
    </style>

    <script>
        window.addEventListener("load", async () => {
            let url = new URL(window.location);
            let form = document.querySelector("form");

            let schema = [
                "name",
                "background",
                "species",
                "class",
                "subclass",
                "acrobatics",
                "athletics",
                "perception",
                "survival",
                "performance",
                "intimidation",
                "history",
                "sleight_of_hand",
                "arcana",
                "medicine",
                "deception",
                "nature",
                "insight",
                "investigation",
                "religion",
                "stealth",
                "persuasion",
                "animal_handling",
                "proficiencies",
                "level",
                "xp",
                "proficiency_bonus",
                "str",
                "dex",
                "con",
                "int",
                "wis",
                "cha",
                "feats",
                "hp",
                "max_hp",
                "temp_hp",
                "hit_dice",
                "death_saves",
                "ac",
                "initiative",
                "speed",
                "size",
                "passive_perception",
                "attacks",
                "equipment",
            ];

            let schemaChanged = false;
            for (let i = 0; i < form.elements.length; i++) {
                if (!schema.includes(form.elements[i].name)) {
                    schemaChanged = true;
                    console.log("new field:", form.elements[i].name);
                }
            }
            if (schemaChanged) {
                window.alert("update the schema!");
                return;
            }

            let data = url.searchParams.get("d");
            if (data != null) {
                data = Uint8Array.fromBase64(data, { alphabet: "base64url" });
                data = new Response(data).body;
                data = data.pipeThrough(new DecompressionStream("deflate-raw"));
                data = await new Response(data).json();
                data.forEach((val, i) => {
                    if (form.elements[schema[i]]) {
                        form.elements[schema[i]].value = val;
                    }
                });
            }

            form.addEventListener("change", async () => {
                let data = schema.map((name) => form.elements[name]?.value ?? "");
                data = new Response(JSON.stringify(data)).body;
                data = data.pipeThrough(new CompressionStream("deflate-raw"));
                data = await new Response(data).bytes();
                data = data.toBase64({ alphabet: "base64url" });

                let newUrl = new URL(url);
                newUrl.search = "?d=" + data;
                window.history.replaceState(null, "", newUrl);
            });
        }, { once: true });
    </script>
</head>

<body>
    <form autocomplete="off" style="display: flex; flex-flow: row nowrap; justify-content: center; padding: 5px auto">
        <div style="display: flex; flex-flow: column nowrap; justify-content: stretch">
            <div class="box box-lines">
                <label>Имя <input name="name" /></label>
                <label>Происхождение <input name="background" /></label>
                <label>Вид <input name="species" /></label>
                <label>Класс <input name="class" /></label>
                <label>Подкласс <input name="subclass" /></label>
            </div>
            <div class="box box-skills">
                <label><input name="acrobatics" /> Акробатика <small>(Dex)</small></label>
                <label><input name="athletics" /> Атлетика <small>(Str)</small></label>
                <label><input name="perception" /> Внимательность <small>(Wis)</small></label>
                <label><input name="survival" /> Выживание <small>(Wis)</small></label>
                <label><input name="performance" /> Выступление <small>(Cha)</small></label>
                <label><input name="intimidation" /> Запугивание <small>(Cha)</small></label>
                <label><input name="history" /> История <small>(Int)</small></label>
                <label><input name="sleight_of_hand" /> Ловкость рук <small>(Dex)</small></label>
                <label><input name="arcana" /> Магия <small>(Int)</small></label>
                <label><input name="medicine" /> Медицина <small>(Wis)</small></label>
                <label><input name="deception" /> Обман <small>(Cha)</small></label>
                <label><input name="nature" /> Природа <small>(Int)</small></label>
                <label><input name="insight" /> Проницательность <small>(Wis)</small></label>
                <label><input name="investigation" /> Расследование <small>(Int)</small></label>
                <label><input name="religion" /> Религия <small>(Int)</small></label>
                <label><input name="stealth" /> Скрытность <small>(Dex)</small></label>
                <label><input name="persuasion" /> Убеждение <small>(Cha)</small></label>
                <label><input name="animal_handling" /> Уход за животными <small>(Wis)</small></label>
            </div>
            <div class="box box-textarea">
                <label>Владения <textarea name="proficiencies" style="height: 296px"></textarea></label>
            </div>
        </div>

        <div style="display: flex; flex-flow: column nowrap">
            <div class="box box-lines">
                <label>Уровень <input name="level" /></label>
                <label>Опыт <input name="xp" /></label>
                <label>Бонус мастерства <input name="proficiency_bonus" /></label>
            </div>
            <div class="box box-lines">
                <label>Сила (Str) <input name="str" /></label>
                <label>Ловкость (Dex) <input name="dex" /></label>
                <label>Телосложение (Con) <input name="con" /></label>
                <label>Интеллект (Int) <input name="int" /></label>
                <label>Мудрость (Wis) <input name="wis" /></label>
                <label>Харизма (Cha) <input name="cha" /></label>
            </div>
            <div class="box box-textarea">
                <label>Черты и умения <textarea name="feats" style="height: 629px"></textarea></label>
            </div>
        </div>

        <div style="display: flex; flex-flow: column nowrap">
            <div class="box box-lines">
                <label>Текущие хиты <input name="hp" /></label>
                <label>Максимум хитов <input name="max_hp" /></label>
                <label>Временные хиты <input name="temp_hp" /></label>
            </div>
            <div class="box box-lines">
                <label>Кости хитов <input name="hit_dice" /></label>
                <label>Спасброски от смерти <input name="death_saves" /></label>
            </div>
            <div class="box box-lines">
                <label>Класс брони <input name="ac" /></label>
            </div>
            <div class="box box-lines">
                <label>Инициатива <input name="initiative" /></label>
                <label>Скорость <input name="speed" /></label>
                <label>Размер <input name="size" /></label>
                <label>Пассивная внимательность <input name="passive_perception" /></label>
            </div>
            <div class="box box-textarea">
                <label>Оружие и атаки <textarea name="attacks" style="height: 198px"></textarea></label>
            </div>
            <div class="box box-textarea">
                <label>Снаряжение <textarea name="equipment" style="height: 296px"></textarea></label>
            </div>
        </div>
    </form>
</body>

</html>
