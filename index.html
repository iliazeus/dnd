<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        :root {
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
            background: #999;
        }

        body {
            background: white;
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
        }

        label {
            font-variant: small-caps;
        }

        input:not([type]),
        input[type=text] {
            border: none;
            border-bottom: solid 1pt #999;
            font-size: 14pt;
        }

        small {
            color: #999;
        }

        .box {
            margin: 5px;
            padding: 5px;
            border: solid 1px black;
            border-radius: 3px;
        }

        .box-lines {
            display: flex;
            flex-flow: column nowrap;
        }

        .box-lines>* {
            display: flex;
            flex-flow: column-reverse nowrap;
            font-size: 10pt;
            width: 98%;
            margin: 0 auto;
        }

        .box-skills {
            display: flex;
            flex-flow: column nowrap;
            font-size: 12pt;
        }

        .box-skills input {
            width: 3em;
        }

        .box-textarea {
            display: flex;
            flex-flow: column nowrap;
        }

        .box-textarea>* {
            display: flex;
            flex-flow: column nowrap;
            width: 98%;
        }

        .box-textarea textarea {
            resize: vertical;
            width: 100%;
            border: none;
            background: repeat url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200pt' height='15pt' viewBox='0 0 200 15'><line x1='0' y1='14' x2='200' y2='14' stroke='%23999' stroke-width='1' /></svg>");
            line-height: 15pt;
        }
    </style>

    <script>
        window.addEventListener("load", async () => {
            let url = new URL(window.location);
            let form = document.querySelector("form");

            let data = url.searchParams.get("d");
            if (data != null) {
                data = Uint8Array.fromBase64(data, { alphabet: "base64url" });
                data = new Response(data).body;
                data = data.pipeThrough(new DecompressionStream("deflate-raw"));
                data = await new Response(data).text();
                data = new URLSearchParams(data);
                for (let [k, v] of data) {
                    form.elements[k].value = v;
                }
            }

            form.addEventListener("change", async () => {
                let data = new URLSearchParams(new FormData(form)).toString();
                data = new Response(data).body;
                data = data.pipeThrough(new CompressionStream("deflate-raw"));
                data = await new Response(data).bytes();
                data = data.toBase64({ alphabet: "base64url" });

                let newUrl = new URL(url);
                newUrl.search = "?d=" + data;
                window.history.replaceState(null, "", newUrl);
            });
        }, { once: true });
    </script>
</head>

<body>
    <form autocomplete="off" style="display: flex; flex-flow: row wrap; justify-content: center; padding: 5px auto">
        <div style="display: flex; flex-flow: column nowrap; justify-content: stretch">
            <div class="box box-lines">
                <label>Name <input name="name" /></label>
                <label>Background <input name="background" /></label>
                <label>Species <input name="species" /></label>
                <label>Class <input name="class" /></label>
                <label>Subclass <input name="subclass" /></label>
            </div>
            <div class="box box-skills">
                <label><input name="acrobatics" /> Acrobatics <small>(Dex)</small></label>
                <label><input name="animal_handling" /> Animal Handling <small>(Wis)</small></label>
                <label><input name="arcana" /> Arcana <small>(Int)</small></label>
                <label><input name="athletics" /> Athletics <small>(Str)</small></label>
                <label><input name="deception" /> Deception <small>(Cha)</small></label>
                <label><input name="history" /> History <small>(Int)</small></label>
                <label><input name="insight" /> Insight <small>(Wis)</small></label>
                <label><input name="intimidation" /> Intimidation <small>(Cha)</small></label>
                <label><input name="investigation" /> Investigation <small>(Int)</small></label>
                <label><input name="medicine" /> Medicine <small>(Wis)</small></label>
                <label><input name="nature" /> Nature <small>(Int)</small></label>
                <label><input name="perception" /> Perception <small>(Wis)</small></label>
                <label><input name="performance" /> Performance <small>(Cha)</small></label>
                <label><input name="persuasion" /> Persuasion <small>(Cha)</small></label>
                <label><input name="religion" /> Religion <small>(Int)</small></label>
                <label><input name="sleight_of_hand" /> Sleight of Hand <small>(Dex)</small></label>
                <label><input name="stealth" /> Stealth <small>(Dex)</small></label>
                <label><input name="survival" /> Survival <small>(Wis)</small></label>
            </div>
            <div class="box box-textarea">
                <label>Proficiencies <textarea name="proficiencies" style="height: 296px"></textarea></label>
            </div>
        </div>

        <div style="display: flex; flex-flow: column nowrap">
            <div class="box box-lines">
                <label>Level <input name="level" /></label>
                <label>XP <input name="xp" /></label>
            </div>
            <div class="box box-lines">
                <label>Strength <input name="str" /></label>
                <label>Dexterity <input name="dex" /></label>
                <label>Constitution <input name="con" /></label>
                <label>Intelligence <input name="int" /></label>
                <label>Wisdom <input name="wis" /></label>
                <label>Charisma <input name="cha" /></label>
            </div>
            <div class="box box-textarea">
                <label>Features and Feats <textarea name="feats" style="height: 671px"></textarea></label>
            </div>
        </div>

        <div style="display: flex; flex-flow: column nowrap">
            <div class="box box-lines">
                <label>Current HP <input name="hp" /></label>
                <label>Max HP <input name="max_hp" /></label>
                <label>Temporary HP <input name="temp_hp" /></label>
            </div>
            <div class="box box-lines">
                <label>Hit Dice <input name="hit_dice" /></label>
                <label>Death Saves <input name="death_saves" /></label>
            </div>
            <div class="box box-lines">
                <label>Armor class <input name="ac" /></label>
            </div>
            <div class="box box-lines">
                <label>Initiative <input name="initiative" /></label>
                <label>Speed <input name="speed" /></label>
                <label>Size <input name="size" /></label>
                <label>Passive Perception <input name="passive_perception" /></label>
            </div>
            <div class="box box-textarea">
                <label>Weapons and Attacks <textarea name="attacks" style="height: 198px"></textarea></label>
            </div>
            <div class="box box-textarea">
                <label>Equipment <textarea name="equipment" style="height: 296px"></textarea></label>
            </div>
        </div>
    </form>
</body>

</html>
