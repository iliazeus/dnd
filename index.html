<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style-print.css" />
    <link rel="stylesheet" href="style-mobile.css" />

    <script src="persist.js"></script>
    <script src="persist-schema.js"></script>

    <script>
        window.addEventListener("load", async () => {
            await setUpPersistenceWithDndSchema({ form: document.querySelector("form#main") });
        }, { once: true });
    </script>
</head>

<body>
    <form id="main" autocomplete="off">
        <div class="column">
            <div class="box">
                <label class="under">Name <input name="name" /></label>
                <label class="under">Background <input name="background" /></label>
                <label class="under">Species <input name="species" /></label>
                <label class="under">Class <input name="class" /></label>
                <label class="under">Subclass <input name="subclass" /></label>
            </div>
            <div class="box">
                <label class="beside"><input name="proficiency_bonus" /> Proficiency bonus</label>
            </div>
            <div class="box">
                <label class="beside"><input name="acrobatics" /> Acrobatics <small>(Dex)</small></label>
                <label class="beside"><input name="animal_handling" /> Animal Handling <small>(Wis)</small></label>
                <label class="beside"><input name="arcana" /> Arcana <small>(Int)</small></label>
                <label class="beside"><input name="athletics" /> Athletics <small>(Str)</small></label>
                <label class="beside"><input name="deception" /> Deception <small>(Cha)</small></label>
                <label class="beside"><input name="history" /> History <small>(Int)</small></label>
                <label class="beside"><input name="insight" /> Insight <small>(Wis)</small></label>
                <label class="beside"><input name="intimidation" /> Intimidation <small>(Cha)</small></label>
                <label class="beside"><input name="investigation" /> Investigation <small>(Int)</small></label>
                <label class="beside"><input name="medicine" /> Medicine <small>(Wis)</small></label>
                <label class="beside"><input name="nature" /> Nature <small>(Int)</small></label>
                <label class="beside"><input name="perception" /> Perception <small>(Wis)</small></label>
                <label class="beside"><input name="performance" /> Performance <small>(Cha)</small></label>
                <label class="beside"><input name="persuasion" /> Persuasion <small>(Cha)</small></label>
                <label class="beside"><input name="religion" /> Religion <small>(Int)</small></label>
                <label class="beside"><input name="sleight_of_hand" /> Sleight of Hand <small>(Dex)</small></label>
                <label class="beside"><input name="stealth" /> Stealth <small>(Dex)</small></label>
                <label class="beside"><input name="survival" /> Survival <small>(Wis)</small></label>
            </div>
            <div class="box" style="flex: 1">
                <label class="textarea">Proficiencies <textarea name="proficiencies"></textarea></label>
            </div>
        </div>

        <div class="column">
            <div class="box">
                <div class="colspan">
                    <label class="under" style="flex: 1">Level <input name="level" size="1" /></label>
                    <label class="under" style="flex: 2">Experience <input name="xp" size="1" /></label>
                </div>
            </div>
            <div class="box">
                <label class="under">Strength <input name="str" /></label>
                <label class="under">Dexterity <input name="dex" /></label>
                <label class="under">Constitution <input name="con" /></label>
                <label class="under">Intelligence <input name="int" /></label>
                <label class="under">Wisdom <input name="wis" /></label>
                <label class="under">Charisma <input name="cha" /></label>
            </div>
            <div class="box" style="flex: 1">
                <label class="textarea">Features and Feats <textarea name="feats"></textarea></label>
            </div>
        </div>

        <div class="column">
            <div class="box">
                <label class="under">Hit Points <input name="hp" /></label>
                <div class="colspan">
                    <label class="under" style="flex: 2">Temporary <input name="temp_hp" size="1" /></label>
                    <label class="under" style="flex: 1">Maximum <input name="max_hp" size="1" /></label>
                </div>
            </div>
            <div class="box">
                <label class="under">Hit Dice <input name="hit_dice" /></label>
                <label class="under">Death Saves <input name="death_saves" /></label>
            </div>
            <div class="box">
                <div class="colspan">
                    <label class="under" style="flex: 1">Armor Class <input name="ac" size="1" /></label>
                    <label class="under" style="flex: 1">Initiative <input name="initiative" size="1" /></label>
                    <label class="under" style="flex: 1">Speed <input name="speed" size="1" /></label>
                </div>
                <div class="colspan">
                    <label class="under" style="flex: 1">Size <input name="size" size="1" /></label>
                    <label class="under" style="flex: 1">Passive Perception <input name="passive_perception"
                            size="1" /></label>
                </div>
            </div>
            <div class="box" style="flex: 1">
                <label class="textarea">Weapons and Attacks <textarea name="attacks"></textarea></label>
            </div>
            <div class="box">
                <label class="under">Money <input name="money" /></label>
            </div>
            <div class="box" style="flex: 3">
                <label class="textarea">Equipment <textarea name="equipment"></textarea></label>
            </div>
        </div>
    </form>
</body>

</html>
